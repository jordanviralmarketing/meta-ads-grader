<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Ad Account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1a1a1a; }
        .container { max-width: 700px; margin: 40px auto; padding: 20px; }
        h1 { margin-bottom: 24px; font-size: 28px; }
        .account { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .account strong { font-size: 16px; }
        .meta { color: #64748b; font-size: 14px; margin: 4px 0 12px; }
        .btn { display: inline-block; background: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 500; font-size: 14px; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select an Ad Account</h1>
        {% for account in accounts %}
        <div class="account">
            <strong>{{ account.name or account.id }}</strong>
            <div class="meta">ID: {{ account.id }} · Status: {{ account.account_status }}</div>
            <a href="/audit/{{ account.id }}" class="btn">Run Audit</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
