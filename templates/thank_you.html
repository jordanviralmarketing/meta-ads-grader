<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Report Is Ready</title>
    {% include "_tracking.html" %}
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #111; }
        .container { max-width: 520px; margin: 100px auto; padding: 20px; text-align: center; }
        .card { background: white; border: 1px solid #e4e4e7; border-radius: 12px; padding: 48px 32px; }
        h1 { font-size: 28px; margin-bottom: 16px; letter-spacing: -0.3px; }
        p { color: #52525b; margin-bottom: 10px; line-height: 1.6; }
        .btn { display: inline-block; background: #0a0a0a; color: white; padding: 16px 32px; border-radius: 6px; text-decoration: none; font-weight: 600; margin-top: 20px; }
        .btn:hover { background: #27272a; }
        .footer { margin-top: 32px; color: #a1a1aa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Your Report Is Ready</h1>
            <p>We’ve emailed a copy of your Meta Ads grade and detailed report.</p>
            <p>Want a human to walk through the findings and show you exactly what to fix?</p>
            <a href="{{ strategy_url }}" class="btn">Book a Free Strategy Session</a>
        </div>
        <div class="footer">The Viral Marketing Company</div>
    </div>
</body>
</html>
